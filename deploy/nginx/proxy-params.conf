# proxy-params.conf — shared proxy directives for FastAPI upstream.
#
# Used by: gsplatform.conf (/api/, /health/)
#
# Rationale:
#   - http/1.1 required by FastAPI (connection pooling + keepalive).
#   - X-Request-ID is propagated by the request-id middleware;
#     X-Forwarded-For/Proto tell FastAPI the real client origin.
#   - proxy_buffering off on /api/ keeps SSE and long-running uploads
#     flowing; keep it ON here and override per-location as needed.
#   - Large body support for uploads (GSUpload upload session);

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID      $request_id;

# Default timeouts: generous but bounded.
proxy_connect_timeout 10s;
proxy_read_timeout    60s;
proxy_send_timeout    60s;

# Keep-alive to upstream (saves a TCP handshake per request).
proxy_set_header Connection "";

# Do NOT compress proxied content by default — SPA assets are already
# compressed; API JSON is small; range-streamed binaries must not be
# transformed.  Enable per-location if needed.
gzip off;
