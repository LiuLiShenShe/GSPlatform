daemon off;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /logs/nginx-error.log warn;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    types {
        application/octet-stream sog splat spz bin;
    }
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 127.0.0.1:5174;
        server_name localhost *.trycloudflare.com;
        client_max_body_size 65m;
        add_header X-Content-Type-Options nosniff always;
        location = /api/id {
            return 404;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:18001;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 120s;
        }
        location /health/ {
            proxy_pass http://127.0.0.1:18001;
            proxy_set_header Host $host;
        }
        location /_scene-origin/ {
            internal;
            alias __SCENE_ORIGIN_ROOT__/;
            sendfile on;
        }
        location = /gaussian-editor {
            return 308 /gaussian-editor/;
        }
        location /gaussian-editor/ {
            proxy_pass http://127.0.0.1:18031;
            proxy_set_header Host $host;
            add_header Referrer-Policy no-referrer always;
        }
        location / {
            proxy_pass http://127.0.0.1:__WEB_PORT__;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
