# scenes-streaming.conf — Production static origin for Streamed SOG assets.
#
# Include from the server block that serves the GSPlatform frontend, e.g.:
#
#   server {
#       listen 8080;
#       root /srv/gsplatform/scenes-assets;   # contains scenes/ + static/
#       include /etc/nginx/conf.d/scenes-streaming.conf;
#   }
#
# Layout on disk (see scripts/build_streamed_sog.sh):
#   scenes/<sceneId>/versions/<asset-version>/lod-meta.json   (upstream index)
#   scenes/<sceneId>/versions/<asset-version>/{lod}_{chunk}/   (chunk units)
#   scenes/<sceneId>/current -> versions/<asset-version>       (symlink)
#
# Requirements implemented (Phase 04 checklist F):
#   F1 real Range: 206 + correct Content-Range/Content-Length (nginx core,
#      no config needed beyond *not* disabling it: `max_ranges`, `slice`
#      and proxy buffering stay at Range-safe defaults; see notes).
#   F2 invalid Range: 416 (nginx core default).
#   F3 manifest short cache; versioned immutable chunks long cache.
#   F4 CORS allowlist restricted to configured frontend origins.
#   F5 HEAD returns correct length (nginx core default for static files).
#   F6 compression never applied to SOG/webp binaries, so Range stays exact.
#   F7 stable MIME types; binaries are never sniffed/executed as text.
#
# Verify after deploy (replace host/paths with the real manifest):
#   curl -I  http://localhost:8080/scenes/stream-medium/current/manifest.json
#   curl -i -H 'Range: bytes=0-1023' \
#        http://localhost:8080/scenes/stream-medium/current/lod-meta.json
#   curl -i -H 'Range: bytes=999999999999-' \
#        http://localhost:8080/scenes/stream-medium/current/lod-meta.json  # 416

# --- MIME types for streamed assets ---------------------------------------
types {
    application/json                      json;
    image/webp                            webp;
    application/octet-stream              sog ply splat spz;
    image/png                             png;
    image/jpeg                            jpg jpeg;
}

# --- Frontend origins allowed to fetch scene bytes (CORS, checklist F4) ---
# Replace with the real deployed frontend origin(s).
map $http_origin $cors_origin {
    default                                "";
    "~^https://gsplatform\.example\.com$"  $http_origin;
    "~^http://localhost(:[0-9]+)?$"         $http_origin;
    "~^http://127\.0\.0\.1(:[0-9]+)?$"      $http_origin;
}

# --- Business manifest: stable path, short cache (checklist F3) -----------
location ~ ^/scenes/[^/]+/(current/)?manifest\.json$ {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Accept, Origin" always;
    add_header Cache-Control "public, max-age=60" always;
    add_header Accept-Ranges bytes always;

    if ($request_method = OPTIONS) { return 204; }

    # Never compress or transform the manifest; keep byte length exact.
    gzip off;
}

# --- Versioned streamed assets: content-hash dir, immutable (F3) ----------
location ~ ^/scenes/[^/]+/(versions/[0-9a-f]+/|current/).+$ {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Accept, Origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Accept-Ranges bytes always;

    if ($request_method = OPTIONS) { return 204; }

    # F6: compression modules must never touch SOG/webp binaries —
    # a transformed body would invalidate Content-Range/Content-Length.
    gzip off;
    gunzip off;
    # No sub_filter / xslt / image_filter here for the same reason.

    # F1: Range stays intact — do NOT enable `slice` (it rewrites ranges
    # into subrequests) and do NOT proxy these paths (proxy buffering can
    # collapse 206 into 200). Serve from local disk only.
}

# --- Safety: never serve dotfiles, staging dirs or checksums lists --------
location ~ ^/scenes/.*/\.(staging-|git|svn)[^/]* {
    deny all;
    return 404;
}
