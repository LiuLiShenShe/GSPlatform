# scenes-streaming.conf — production scene-asset origin (Phase 04 F + Phase 09 E).
#
# Included from gsplatform.conf INSIDE `location /_scene-origin/` (FIX-01:
# the location is now `internal` — reachable only via FastAPI's
# X-Accel-Redirect after the SceneAccessPolicy authorizes the scene):
#
#   location /_scene-origin/ {
#       internal;
#       alias /srv/gsplatform-data/scene-origin/;
#       include /etc/nginx/gsplatform/scenes-streaming.conf;
#   }
#
# The origin tree mirrors the URL space:
#   /_scene-origin/<slug>/current/manifest.json
#   /_scene-origin/<slug>/versions/<sha>/{lod}_{chunk}/...
#   /_scene-origin/<slug>/poster.webp
# where `current -> versions/<sha>` is a relative symlink written by the
# publish service (production bridge) or build_streamed_sog.sh.
#
# `map` and MIME `types` used here are defined at http context in
# gsplatform.conf (map $http_origin $cors_origin / $request_uri $scene_cache_control).

# --- CORS: only the production frontend origin may fetch scene bytes. -------
# $cors_origin is set by the http-level map in gsplatform.conf (empty otherwise).

# --- Range / cache / headers for every scene asset ---------------------------
# Nginx core gives us correct 206 + Content-Range for single ranges and 416
# for unsatisfiable ones.  We must NOT enable `slice`, `proxy_*` buffering,
# gzip/gunzip or any filter that would rewrite byte offsets (F1/F2/F6).
gzip off;
gunzip off;
# NOTE: do not add sub_filter/xslt/image_filter here — any body-transform
# module would invalidate Content-Range/Content-Length on range responses.

add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
add_header Access-Control-Allow-Headers "Range, Accept, Origin, Content-Type" always;
add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;
add_header Accept-Ranges bytes always;

# $scene_cache_control comes from the http-level map on $request_uri:
#   manifest.json -> short cache; poster -> 1 day; versioned chunks -> immutable.
# FIX-05 §7-§10: Nginx must NOT re-stamp Cache-Control on scene bytes — the
# scope-aware header set by FastAPI (`SceneAssetService.build_cache_control`)
# is the single authority.  It knows the *access scope* (PUBLIC/OWNER/SHARE),
# which Nginx cannot derive from $request_uri alone; a `public, immutable`
# default here would override a private scene's `private, no-cache` and
# re-introduce P1-3.  The map remains only as policy documentation.
# add_header Cache-Control $scene_cache_control always;

if ($request_method = OPTIONS) { return 204; }
