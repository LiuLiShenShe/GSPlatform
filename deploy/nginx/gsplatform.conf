# gsplatform.conf — GSPlatform production Nginx site.
#
# Include from /etc/nginx/conf.d/ (http context) on the Ubuntu host.
# Presumes:
#   - FastAPI listens on 127.0.0.1:8001 (GS_API_HOST/GS_API_PORT)
#   - web build lives at /opt/gsplatform/current/apps/web/dist
#   - scene origin tree at /srv/gsplatform-data/scene-origin (GS_SCENE_ORIGIN_ROOT)
#   - TLS key/cert at /etc/letsencrypt/live/<DOMAIN>/{fullchain.pem,privkey.pem}
#     (provisioned by certbot; auto-renew via certbot.timer)
#
# Replace <DOMAIN> everywhere (4 places below) with the real production domain.

# --- http-context helpers used by scenes-streaming.conf (CORS + cache) ----
# Non-default MIME extensions for scene binaries (json/webp/png/jpg already
# covered by nginx's built-in types).
types {
    application/octet-stream              sog ply splat spz;
}

# Frontend origins allowed to fetch scene bytes (must match GS_CORS_ORIGINS).
map $http_origin $cors_origin {
    default                                "";
    "~^https://<DOMAIN>$"                  $http_origin;
    "~^https://www\.<DOMAIN>$"             $http_origin;
}

# Short cache for the stable manifest path, longer for poster, immutable for
# content-hashed versioned chunks (F3/E).
map $request_uri $scene_cache_control {
    default                            "public, max-age=31536000, immutable";
    ~/manifest\.json$                  "public, max-age=60";
    ~/poster\.webp$                    "public, max-age=86400";
}

# --- HTTP 80: ACME challenge + redirect everything to HTTPS -------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name <DOMAIN> www.<DOMAIN>;

    # Let's Encrypt challenge.  certbot writes here before reload.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else -> HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS 443: the whole product --------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <DOMAIN> www.<DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Security headers (E: nginx & https checklist) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: tuned for the SuperSplat viewer (wasm + web workers need 'unsafe-eval'
    # in some builds; tighten after verifying the viewer works).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    # xr-spatial-tracking=(self) allows the /xr/* pages to start immersive
    # WebXR sessions (required by Quest / PICO browsers).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), xr-spatial-tracking=(self)" always;

    access_log /var/log/nginx/gsplatform.access.log;
    error_log  /var/log/nginx/gsplatform.error.log;

    root /opt/gsplatform/current/apps/web/dist;

    # --- Web SPA ---
    # Immutable, content-hashed assets first (long cache).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /viewer/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA navigation fallback — returns index.html for non-file routes
    # (e.g. /works, /scene/<id>) but NEVER for /assets/ (handled above).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API reverse proxy ---
    location /api/ {
        include /etc/nginx/gsplatform/proxy-params.conf;
        # Uploads: allow up to the API's configured max (5GB).
        client_max_body_size 6g;
        client_body_timeout 300s;
        proxy_pass http://127.0.0.1:8001;
    }

    # --- Health probes ---
    location = /health/live  { include /etc/nginx/gsplatform/proxy-params.conf; proxy_pass http://127.0.0.1:8001; add_header Cache-Control "no-store"; }
    location = /health/ready { include /etc/nginx/gsplatform/proxy-params.conf; proxy_pass http://127.0.0.1:8001; add_header Cache-Control "no-store"; }

    # --- Scene assets: public Streamed SOG origin (Range 206/416) ---
    # Served from the scene-origin tree (contains published versions +
    # current symlinks).  Private/authorized delivery is handled by the API
    # (X-Accel internal redirect is not used; see ROLLBACK/known issues).
    location /local-scenes/ {
        alias /srv/gsplatform-data/scene-origin/;
        include /etc/nginx/gsplatform/scenes-streaming.conf;
    }

    # --- Deny access to anything that is not product URL space ---
    location ~ ^/(\.env|\.git|staging|quarantine|jobs|backups|logs) {
        deny all;
        return 404;
    }
}
