<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSPlatform WebXR Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; color: #fff; font-family: system-ui;
    }
    #ui-overlay.hidden { display: none; }
    #status-text { font-size: 14px; opacity: 0.8; margin-top: 12px; }
    #enter-vr-btn {
      pointer-events: auto;
      padding: 12px 24px; font-size: 16px; border: none; border-radius: 8px;
      background: #4a90d9; color: #fff; cursor: pointer;
      margin-top: 16px; transition: background 0.2s;
    }
    #enter-vr-btn:hover { background: #5aa0e9; }
    #enter-vr-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #scene-info {
      position: fixed; bottom: 12px; left: 12px; color: #aaa;
      font-size: 12px; font-family: monospace; z-index: 10;
    }
    #error-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); color: #f55; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      font-family: system-ui; z-index: 20;
    }
    #error-overlay.hidden { display: none; }
    #error-overlay h2 { margin-bottom: 8px; }
    #error-overlay p { color: #ccc; font-size: 14px; max-width: 500px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="xr-canvas"></canvas>

  <div id="ui-overlay">
    <div id="status-text">Initializing…</div>
    <button id="enter-vr-btn" disabled>Enter VR</button>
  </div>

  <div id="scene-info"></div>

  <div id="error-overlay" class="hidden">
    <h2>WebXR Error</h2>
    <p id="error-message"></p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
